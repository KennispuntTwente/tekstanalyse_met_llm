name: (2) Build & push container

# Build container on push to main (preview) or on release (version+latest)
#
# This workflow is triggered by:
#   * **push to main**            → builds a `preview` tag for quick testing
#   * **release published**       → builds **the same commit** and tags the image as `<version>` **and** `latest`
#
# Behaviour:
#   • Push builds → `preview`                (for every commit to main)
#   • Release builds → `<version>` & `latest` (no `preview` tag)

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  IMAGE_NAME: ghcr.io/kennispunttwente/tekstanalyse_met_llm
  BASE_IMAGE_NAME: ghcr.io/kennispunttwente/tekstanalyse_met_llm-base
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # Checkout – the tagged commit on release, otherwise just HEAD
      - name: Checkout release tag
        if: github.event_name == 'release'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout commit
        if: github.event_name != 'release'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      # Determine which tags we should push
      - name: Set image tags
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tags=${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }},${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE_NAME }}:preview" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${{ env.IMAGE_NAME }}:preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute base image tag (dependency hash)
        id: base
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Dockerfile.base ]; then
            echo "Dockerfile.base not found" >&2
            exit 1
          fi

          files=(Dockerfile.base renv.lock pyproject.toml uv.lock)
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Required dependency file missing: $f" >&2
              exit 1
            fi
          done

          dep_hash=$(cat "${files[@]}" | sha256sum | awk '{print $1}')
          base_tag="base-${dep_hash}"

          echo "dep_hash=${dep_hash}" >> "$GITHUB_OUTPUT"
          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${{ env.BASE_IMAGE_NAME }}:${base_tag}" >> "$GITHUB_OUTPUT"

      # Log in to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Check whether base image already exists
        id: base_exists
        shell: bash
        run: |
          set -euo pipefail

          if ! raw_manifest=$(docker buildx imagetools inspect --raw "${{ steps.base.outputs.base_ref }}" 2> /dev/null); then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing_platforms=()
          IFS=',' read -ra required_platforms <<< "${{ env.IMAGE_PLATFORMS }}"
          for platform in "${required_platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"

            if ! jq -e --arg os "$os" --arg arch "$arch" '
              if has("manifests") then
                any(.manifests[]?; .platform.os == $os and .platform.architecture == $arch)
              else
                .os == $os and .architecture == $arch
              end
            ' <<< "$raw_manifest" > /dev/null; then
              missing_platforms+=("$platform")
            fi
          done

          if [ "${#missing_platforms[@]}" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            printf 'missing_platforms=%s\n' "${missing_platforms[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push base image (heavy deps)
        if: steps.base_exists.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ${{ steps.base.outputs.base_ref }}
            ${{ env.BASE_IMAGE_NAME }}:base-latest
          platforms: ${{ env.IMAGE_PLATFORMS }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE_NAME }}:buildcache,mode=max

      - name: Update moving base tag (base-latest)
        if: steps.base_exists.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ env.BASE_IMAGE_NAME }}:base-latest" \
            "${{ steps.base.outputs.base_ref }}"

      # Build & push (tags determined above)
      - name: Build & push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.base_ref }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Show resulting multi-arch manifest in GHCR
      - name: Check published image manifests
        run: |
          docker buildx imagetools inspect "${{ steps.vars.outputs.primary_tag }}"
