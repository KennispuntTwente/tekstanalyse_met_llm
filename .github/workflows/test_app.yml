name: (0) Test app

# This workflow runs the shinytest2 end-to-end tests (tests/testthat/test-e2e-*.R)
# These tests verify that basic procedures in the app function
# Workflow derived from https://github.com/rstudio/shinytest2/tree/main/actions/test-app/example-test-app-description.yaml

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-app:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: "4.5.1"}

    # ── Environment ─────────────────────────────────────────────────────
    env:
      GITHUB_PAT:        ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      R_KEEP_PKG_SOURCE: yes
      # Enable true async processing in tests to catch async-related bugs
      # (e.g., objects not properly passed to future workers)
      KWALLM_TEST_ASYNC: "true"
      # Enable prompt/response tracing for debugging test runs
      KWALLM_LOG_PROMPTS_TO_FILE: "true"

    steps:
      # 1 source code ---------------------------------------------------
      - uses: actions/checkout

      # 2 uv ------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv

      - name: Install python modules with uv
        run: uv sync

      # 2 system deps for R packages -----------------------------------
      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libfontconfig1-dev libpng-dev \
          libx11-dev libnode-dev libwebp-dev

      # 4 R toolchain ---------------------------------------------------
      - uses: r-lib/actions/setup-pandoc
      - uses: r-lib/actions/setup-r
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv

      # 5 run the tests -------------------------------------------------
      - name: Run shinytest2 tests
        id: run-tests
        shell: Rscript {0}
        run: |
          shinytest2::test_app(".")

      # 6 upload snapshots and logs -------------------------------------
      - name: Upload test snapshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-r${{ matrix.config.r }}-testthat-snapshots
          path: |
            tests/testthat/_snaps
            logs
            tests/testthat/logs
